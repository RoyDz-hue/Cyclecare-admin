<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1420"/>
      <stop offset="50%" stop-color="#4A1E31"/>
      <stop offset="100%" stop-color="#1F0D16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF80AB"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="12 16" opacity="0.6"/>
  <!-- Central CycleCare Crescent and Emblem -->
  <path d="M256 120 C180 120 120 180 120 256 C120 332 180 392 256 392 C210 350 190 290 200 230 C210 170 240 135 256 120 Z" fill="url(#rose)" filter="url(#glow)"/>
  <circle cx="290" cy="220" r="28" fill="url(#gold)" filter="url(#glow)"/>
  <circle cx="340" cy="275" r="14" fill="#FFE082"/>
  <circle cx="320" cy="330" r="10" fill="#FFE082" opacity="0.8"/>
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#FFD54F" text-anchor="middle" letter-spacing="4">CYCLECARE ADMIN</text>
</svg>
